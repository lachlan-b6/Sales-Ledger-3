@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

html, body {
  overflow-x: hidden;
  width: 100%;
  margin: 0;
}

.tracker-root {
  --paper: #F3F4F7;
  --paper-card: #FFFFFF;
  --ink: #14161F;
  --ink-light: #6B7280;
  --rule: #E7E8EC;
  --brass: #0D9488;
  --stamp-green: #16A34A;
  --stamp-amber: #D97706;
  --stamp-blue: #2563EB;
  --stamp-red: #DC2626;
  --font-display: 'Manrope', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --font-ui: 'Inter', sans-serif;
  --shadow-card: 0 1px 2px rgba(20, 22, 31, 0.04), 0 2px 8px rgba(20, 22, 31, 0.05);

  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  min-height: 100dvh;
  padding: 0 16px calc(86px + env(safe-area-inset-bottom)) 16px;
  box-sizing: border-box;
  -webkit-text-size-adjust: 100%;
}
.tracker-root * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

.loading {
  font-family: var(--font-display);
  font-size: 18px;
  padding: 60px 0;
  text-align: center;
  color: var(--ink-light);
}

.app-header {
