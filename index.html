const uid = () =>
  (typeof crypto !== "undefined" && crypto.randomUUID)
    ? crypto.randomUUID()
    : `id-${Date.now()}-${Math.random().toString(16).slice(2)}`;

function defaultFYStartYear() {
  const now = new Date();
  const month = now.getMonth(); // 0 = Jan
  return month >= 6 ? now.getFullYear() : now.getFullYear() - 1;
}

function fyLabel(startYear) {
  return `FY ${startYear}/${String((startYear + 1) % 100).padStart(2, "0")}`;
}

function fyBounds(startYear) {
  const start = new Date(startYear, 6, 1); // 1 Jul
  const end = new Date(startYear + 1, 5, 30, 23, 59, 59); // 30 Jun
  return { start, end };
}

function inFY(dateStr, startYear) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return false;
  const { start, end } = fyBounds(startYear);
  return d >= start && d <= end;
}

function fyMonthIndex(dateStr) {
  // returns 0-11 where 0 = July
  const d = new Date(dateStr);
  const m = d.getMonth(); // 0 = Jan
  return (m + 6) % 12;
}

const money = (n, decimals = 0) =>
  new Intl.NumberFormat("en-AU", {
    style: "currency",
    currency: "AUD",
    maximumFractionDigits: decimals,
    minimumFractionDigits: decimals,
  }).format(Number(n) || 0);

const fmtDate = (s) => {
  if (!s) return "—";
  const d = new Date(s);
  if (isNaN(d.getTime())) return "—";
  return d.toLocaleDateString("en-AU", { day: "numeric", month: "short", year: "numeric" });
};

function daysBetween(a, b) {
  const d1 = new Date(a);
  const d2 = new Date(b);
  if (isNaN(d1.getTime()) || isNaN(d2.getTime())) return null;
  return Math.round((d2.getTime() - d1.getTime()) / 86400000);
}

/* ---------------------------------------------------------------------- */
/* Mini charts (plain CSS/SVG — replaces recharts so this file has zero    */
/* build step and no external chart library dependency)                   */
/* ---------------------------------------------------------------------- */

function MiniBarChart({ data, dataKey, labelKey, color, formatValue, height = 150 }) {
  const max = Math.max(1, ...data.map((d) => Number(d[dataKey]) || 0));
  return (
    <div className="mini-chart" style={{ height }}>
      <div className="mini-chart-bars">
        {data.map((d, i) => {
          const v = Number(d[dataKey]) || 0;
          const pct = max > 0 ? (v / max) * 100 : 0;
          return (
            <div key={i} className="mini-bar-col" title={`${d[labelKey]}: ${formatValue(v)}`}>
              <div className="mini-bar-track">
                <div className="mini-bar-fill" style={{ height: `${pct}%`, background: color }} />
              </div>
              <div className="mini-bar-label">{d[labelKey]}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function MiniHBarChart({ data, dataKey, labelKey, color, formatValue }) {
  const max = Math.max(1, ...data.map((d) => Number(d[dataKey]) || 0));
  return (
    <div className="mini-hbar-chart">
      {data.map((d, i) => {
        const v = Number(d[dataKey]) || 0;
        const pct = max > 0 ? (v / max) * 100 : 0;
        return (
          <div key={i} className="mini-hbar-row" title={`${d[labelKey]}: ${formatValue(v)}`}>
            <div className="mini-hbar-label">{d[labelKey]}</div>
            <div className="mini-hbar-track">
              <div className="mini-hbar-fill" style={{ width: `${pct}%`, background: color }} />
            </div>
            <div className="mini-hbar-value">{formatValue(v)}</div>
          </div>
        );
      })}
    </div>
  );
}

function MiniAreaChart({ data, dataKey, labelKey, color, height = 165 }) {
  const max = Math.max(1, ...data.map((d) => Number(d[dataKey]) || 0));
  const n = data.length;
  const points = data.map((d, i) => {
    const x = n > 1 ? (i / (n - 1)) * 100 : 50;
    const y = 100 - ((Number(d[dataKey]) || 0) / max) * 100;
    return [x, y];
  });
  const linePath = points.map((p, i) => `${i === 0 ? "M" : "L"} ${p[0]} ${p[1]}`).join(" ");
  const areaPath = `${linePath} L 100 100 L 0 100 Z`;
  return (
    <div className="mini-area-chart" style={{ height }}>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" className="mini-area-svg">
        <defs>
          <linearGradient id="areaFillGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="5%" stopColor={color} stopOpacity="0.4" />
            <stop offset="95%" stopColor={color} stopOpacity="0.03" />
          </linearGradient>
        </defs>
        <path d={areaPath} fill="url(#areaFillGradient)" stroke="none" />
        <path d={linePath} fill="none" stroke={color} strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
      </svg>
      <div className="mini-area-labels">
        {data.map((d, i) => (
          <span key={i} className="mini-area-label">{d[labelKey]}</span>
        ))}
      </div>
    </div>
  );
}

function ImportDataModal({ onImport, onClose }) {
  const [text, setText] = useState("");
  const [result, setResult] = useState(null);

  const handleSubmit = (e) => {
    e.preventDefault();
    const outcome = onImport(text);
    setResult(outcome);
    if (outcome.ok) setText("");
  };

  return (
    <Modal title="Import data" onClose={onClose}>
      <p className="import-help">
        Paste the block of data given to you in chat, then tap Import. This writes straight to your
        own private storage — it never becomes part of the app's code, so it stays out of the
        published link.
      </p>
      <form onSubmit={handleSubmit} className="entry-form">
        <textarea
          className="import-textarea"
          value={text}
          onChange={(e) => setText(e.target.value)}
          placeholder='{"sales": [...], "referrals": [...]}'
          rows={10}
        />
        {result && (
          <p className={result.ok ? "import-result ok" : "import-result error"}>{result.message}</p>
        )}
        <div className="form-actions">
          <button type="button" className="btn ghost" onClick={onClose}>Close</button>
          <button type="submit" className="btn primary">Import</button>
        </div>
      </form>
    </Modal>
  );
}

/* Dashboard tab                                                           */
/* ---------------------------------------------------------------------- */

function DashboardTab({ salesInFY, referralsInFY, fyStartYear, onImportClick }) {
  const totalSaleValue = salesInFY.reduce((s, r) => s + (Number(r.salePrice) || 0), 0);
  const totalGross = salesInFY.reduce((s, r) => s + (Number(r.grossCommission) || 0), 0);
  const totalYourGCI = salesInFY.reduce((s, r) => s + (Number(r.yourGCI) || 0), 0);
  const settledCount = salesInFY.filter((r) => r.status === "Settled").length;
  const avgSale = salesInFY.length ? totalSaleValue / salesInFY.length : 0;
  const avgYourGciPerSale = salesInFY.length ? totalYourGCI / salesInFY.length : 0;

  const roleRows = ROLES.map((role) => {
    const rows = salesInFY.filter((r) => r.role === role);
    return {
      role,
      count: rows.length,
      saleValue: rows.reduce((s, r) => s + (Number(r.salePrice) || 0), 0),
      gross: rows.reduce((s, r) => s + (Number(r.grossCommission) || 0), 0),
      yourGci: rows.reduce((s, r) => s + (Number(r.yourGCI) || 0), 0),
    };
  });

  const statusRows = STATUSES.map((status) => {
    const rows = salesInFY.filter((r) => r.status === status);
    return {
      status,
      count: rows.length,
      value: rows.reduce((s, r) => s + (Number(r.salePrice) || 0), 0),
    };
  }).filter((s) => s.count > 0);

  const monthlyData = MONTH_LABELS.map((label, idx) => {
    const gci = salesInFY
      .filter((r) => r.settlementDate && fyMonthIndex(r.settlementDate) === idx)
      .reduce((s, r) => s + (Number(r.yourGCI) || 0), 0);
    return { month: label, gci };
  });

  let runningTotal = 0;
  const monthlyCumulative = monthlyData.map((m) => {
    runningTotal += m.gci;
    return { ...m, cumulative: runningTotal };
  });

  const roleChartData = roleRows.map((r) => ({ name: r.role.replace(" Agent", ""), gci: r.yourGci }));

  const topSales = [...salesInFY]
    .sort((a, b) => (Number(b.salePrice) || 0) - (Number(a.salePrice) || 0))
    .slice(0, 5);

  const leadSourceMap = {};
  salesInFY.forEach((r) => {
    const key = r.leadSource || "Unspecified";
    if (!leadSourceMap[key]) leadSourceMap[key] = { name: key, count: 0, value: 0, gci: 0 };
    leadSourceMap[key].count += 1;
    leadSourceMap[key].value += Number(r.salePrice) || 0;
    leadSourceMap[key].gci += Number(r.yourGCI) || 0;
  });
  const leadSourceRows = Object.values(leadSourceMap).sort((a, b) => b.gci - a.gci);

  const suburbMap = {};
  salesInFY.forEach((r) => {
    const key = (r.suburb || "").trim() || "Unspecified";
    if (!suburbMap[key]) suburbMap[key] = { name: key, count: 0, value: 0, gci: 0 };
    suburbMap[key].count += 1;
    suburbMap[key].value += Number(r.salePrice) || 0;
    suburbMap[key].gci += Number(r.yourGCI) || 0;
  });
  const suburbRows = Object.values(suburbMap).sort((a, b) => b.count - a.count).slice(0, 6);

  const lagDays = salesInFY
    .filter((r) => r.soldDate && r.settlementDate)
    .map((r) => daysBetween(r.soldDate, r.settlementDate))
    .filter((d) => d !== null && d >= 0);
  const avgLagDays = lagDays.length ? Math.round(lagDays.reduce((s, d) => s + d, 0) / lagDays.length) : null;

  const referralTotalCommission = referralsInFY.reduce((s, r) => s + (Number(r.referralCommission) || 0), 0);
  const referralStatusRows = REFERRAL_STATUSES.map((status) => ({
    status,
    count: referralsInFY.filter((r) => r.status === status).length,
    commission: referralsInFY
      .filter((r) => r.status === status)
      .reduce((s, r) => s + (Number(r.referralCommission) || 0), 0),
  })).filter((s) => s.count > 0);
  const paidReferrals = referralsInFY.filter((r) => r.status === "Paid").length;
  const referralPaidRate = referralsInFY.length ? Math.round((paidReferrals / referralsInFY.length) * 100) : null;

  const insights = [];
  if (leadSourceRows.length) {
    const top = leadSourceRows[0];
    insights.push(`${top.name} is your strongest lead source this FY — ${top.count} sale${top.count === 1 ? "" : "s"} worth ${money(top.gci, 2)} in GCI.`);
  }
  if (suburbRows.length) {
    const top = suburbRows[0];
    insights.push(`${top.name} leads by volume with ${top.count} sale${top.count === 1 ? "" : "s"} this FY.`);
  }
  if (avgLagDays !== null) {
    insights.push(`Average time from sold to settlement: ${avgLagDays} day${avgLagDays === 1 ? "" : "s"}.`);
  }
  if (salesInFY.length) {
    insights.push(`Average GCI per sale this FY: ${money(avgYourGciPerSale, 2)}.`);
  }
  if (referralPaidRate !== null) {
    insights.push(`${referralPaidRate}% of rental referrals logged this FY have been paid.`);
  }

  return (
    <div className="dashboard">
      <button className="import-link" onClick={onImportClick}>
        <Upload size={13} /> Import data
      </button>
      <div className="stat-strip">
        <StatCard label="Settlements booked" value={salesInFY.length} sub={`${settledCount} settled`} />
        <StatCard label="Total sale value" value={money(totalSaleValue)} />
        <StatCard label="Gross commission" value={money(totalGross, 2)} />
        <StatCard label="Your GCI" value={money(totalYourGCI, 2)} sub="ledger total, this FY" />
        <StatCard label="Average sale price" value={salesInFY.length ? money(avgSale) : "—"} />
      </div>

      <div className="panel">
        <h4>Top 5 sales, {fyLabel(fyStartYear)}</h4>
        {topSales.length === 0 ? (
          <p className="muted">No sales logged for this FY yet.</p>
        ) : (
          <div className="top-sales-list">
            {topSales.map((s, i) => (
              <div key={s.id} className="top-sale-card">
                <div className="top-sale-photo-wrap">
                  <PropertyPhoto src={s.photoUrl} alt={s.address} />
                  <span className="top-sale-rank">#{i + 1}</span>
                </div>
                <div className="top-sale-info">
                  <div className="top-sale-text">
                    <div className="addr">{s.address}</div>
                    <div className="suburb">{s.suburb}</div>
                  </div>
                  <div className="top-sale-price">{money(s.salePrice)}</div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="dash-columns">
        <div className="panel">
          <h4>By agent role</h4>
          <div className="table-scroll">
            <table className="ledger-table compact">
            <thead>
              <tr>
                <th>Role</th>
                <th>Count</th>
                <th>Sale value</th>
                <th>Gross comm.</th>
                <th>Your GCI</th>
              </tr>
            </thead>
            <tbody>
              {roleRows.map((r) => (
                <tr key={r.role}>
                  <td>{r.role}</td>
                  <td className="num">{r.count}</td>
                  <td className="num">{money(r.saleValue)}</td>
                  <td className="num">{money(r.gross, 2)}</td>
                  <td className="num">{money(r.yourGci, 2)}</td>
                </tr>
              ))}
            </tbody>
            </table>
          </div>

          {statusRows.length > 0 && (
            <>
              <h4 className="mt">Pipeline by status</h4>
              <div className="stamp-row">
                {statusRows.map((s) => (
                  <div key={s.status} className="stamp-count">
                    <Stamp label={s.status} />
                    <span className="stamp-count-num">{s.count} · {money(s.value)}</span>
                  </div>
                ))}
              </div>
            </>
          )}
        </div>

        <div className="panel">
          <h4>Your GCI by role</h4>
          <div className="chart-wrap">
            <MiniBarChart data={roleChartData} dataKey="gci" labelKey="name" color="var(--brass)" formatValue={(v) => money(v, 2)} height={150} />
          </div>

          <h4 className="mt">Your GCI by month, {fyLabel(fyStartYear)}</h4>
          <div className="chart-wrap">
            <MiniBarChart data={monthlyData} dataKey="gci" labelKey="month" color="var(--ink-light)" formatValue={(v) => money(v, 2)} height={150} />
          </div>
        </div>
      </div>

      <div className="panel">
        <h4>Cumulative GCI progress, {fyLabel(fyStartYear)}</h4>
        <div className="chart-wrap">
          <MiniAreaChart data={monthlyCumulative} dataKey="cumulative" labelKey="month" color="var(--brass)" height={165} />
        </div>
      </div>

      {insights.length > 0 && (
        <div className="panel">
          <h4>Key insights, {fyLabel(fyStartYear)}</h4>
          <ul className="insight-list">
            {insights.map((line, i) => (
              <li key={i} className="insight-item">{line}</li>
            ))}
          </ul>
        </div>
      )}

      <div className="dash-columns">
        <div className="panel">
          <h4>Lead source performance</h4>
          {leadSourceRows.length === 0 ? (
            <p className="muted">No sales logged for this FY yet.</p>
          ) : (
            <div className="chart-wrap">
              <MiniHBarChart data={leadSourceRows} dataKey="gci" labelKey="name" color="var(--stamp-blue)" formatValue={(v) => money(v, 2)} />
            </div>
          )}
        </div>

        <div className="panel">
          <h4>Top suburbs by volume</h4>
          {suburbRows.length === 0 ? (
            <p className="muted">No sales logged for this FY yet.</p>
          ) : (
            <div className="chart-wrap">
              <MiniHBarChart data={suburbRows} dataKey="count" labelKey="name" color="var(--stamp-green)" formatValue={(v) => `${v} sale${v === 1 ? "" : "s"}`} />
            </div>
          )}
        </div>
      </div>

      <div className="panel">
        <h4>Rental referrals, {fyLabel(fyStartYear)}</h4>
        <div className="stat-strip small">
          <StatCard label="Total referrals" value={referralsInFY.length} />
          <StatCard label="Referral commission" value={money(referralTotalCommission, 2)} />
          <StatCard label="Paid conversion" value={referralPaidRate !== null ? `${referralPaidRate}%` : "—"} />
        </div>
        {referralStatusRows.length > 0 && (
          <div className="stamp-row">
            {referralStatusRows.map((s) => (
              <div key={s.status} className="stamp-count">
                <Stamp label={s.status} />
                <span className="stamp-count-num">{s.count} · {money(s.commission, 2)}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

  const rows = useMemo(() => {
    return sales
      .filter((r) => inFY(r.settlementDate, fyStartYear))

function PropertySalesTracker() {
  const [loading, setLoading] = useState(true);
  const [saveError, setSaveError] = useState(false);
  const [sales, setSales] = useState([]);
  const [referrals, setReferrals] = useState([]);
  const [fyStartYear, setFyStartYear] = useState(defaultFYStartYear());
  const [tab, setTab] = useState("dashboard");
  const [importOpen, setImportOpen] = useState(false);

  useEffect(() => {
    let meta = document.querySelector('meta[name="viewport"]');
    if (!meta) {
      meta = document.createElement("meta");
      meta.name = "viewport";
      document.head.appendChild(meta);
    }
    meta.setAttribute("content", "width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover");
  }, []);

  const persist = useCallback((nextSales, nextReferrals, nextFY) => {
    try {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
          sales: nextSales,
          referrals: nextReferrals,
          fyStartYear: nextFY,
        })
      );
      setSaveError(false);
    } catch (e) {
      setSaveError(true);
    }
  }, []);

  useEffect(() => {
    let loadedSales = [];
    let loadedReferrals = [];
    let loadedFY = defaultFYStartYear();
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        loadedSales = Array.isArray(parsed.sales) ? parsed.sales : [];
        loadedReferrals = Array.isArray(parsed.referrals) ? parsed.referrals : [];
        loadedFY = typeof parsed.fyStartYear === "number" ? parsed.fyStartYear : defaultFYStartYear();
      }
    } catch (e) {
      // No stored data yet, or it couldn't be read — start empty.
    }
    setSales(loadedSales);
    setReferrals(loadedReferrals);
    setFyStartYear(loadedFY);
    setLoading(false);
  }, []);

  const changeFY = (delta) => {
    const next = fyStartYear + delta;
    setFyStartYear(next);
    persist(sales, referrals, next);
  };

  const addSale = (sale) => {
    const next = [...sales, sale];
    setSales(next);
    persist(next, referrals, fyStartYear);
  };
  const updateSale = (sale) => {
    const next = sales.map((s) => (s.id === sale.id ? sale : s));
    setSales(next);
    persist(next, referrals, fyStartYear);
  };
  const deleteSale = (id) => {
    const next = sales.filter((s) => s.id !== id);
    setSales(next);
    persist(next, referrals, fyStartYear);
  };

  const addReferral = (referral) => {
    const next = [...referrals, referral];
    setReferrals(next);
    persist(sales, next, fyStartYear);
  };
  const updateReferral = (referral) => {
    const next = referrals.map((r) => (r.id === referral.id ? referral : r));
    setReferrals(next);
    persist(sales, next, fyStartYear);
  };
  const deleteReferral = (id) => {
    const next = referrals.filter((r) => r.id !== id);
    setReferrals(next);
    persist(sales, next, fyStartYear);
  };

  const handleImport = (text) => {
    let parsed;
    try {
      parsed = JSON.parse(text);
    } catch (e) {
      return { ok: false, message: "That doesn't look like valid data — check nothing got cut off when you pasted it." };
    }

    const incomingSales = Array.isArray(parsed.sales) ? parsed.sales : [];
    const incomingReferrals = Array.isArray(parsed.referrals) ? parsed.referrals : [];
    if (incomingSales.length === 0 && incomingReferrals.length === 0) {
      return { ok: false, message: "No sales or referrals found in that data." };
    }

    const saleKey = (s) => `${(s.address || "").toLowerCase().trim()}|${s.settlementDate || ""}|${s.salePrice || ""}`;
    const existingSaleKeys = new Set(sales.map(saleKey));
    const newSales = incomingSales
      .filter((s) => !existingSaleKeys.has(saleKey(s)))
      .map((s) => ({ ...emptySale(), ...s, id: uid() }));

    const referralKey = (r) => `${(r.address || "").toLowerCase().trim()}|${r.referralDate || ""}|${r.referralCommission || ""}`;
    const existingReferralKeys = new Set(referrals.map(referralKey));
    const newReferrals = incomingReferrals
      .filter((r) => !existingReferralKeys.has(referralKey(r)))
      .map((r) => ({ ...emptyReferral(), ...r, id: uid() }));

    const nextSales = [...sales, ...newSales];
    const nextReferrals = [...referrals, ...newReferrals];
    setSales(nextSales);
    setReferrals(nextReferrals);
    persist(nextSales, nextReferrals, fyStartYear);

    const skipped = (incomingSales.length - newSales.length) + (incomingReferrals.length - newReferrals.length);
    let message = `Added ${newSales.length} sale${newSales.length === 1 ? "" : "s"} and ${newReferrals.length} referral${newReferrals.length === 1 ? "" : "s"}.`;
    if (skipped > 0) {
      message += ` Skipped ${skipped} that looked already imported.`;
    }
    return { ok: true, message };
  };

  const salesInFY = useMemo(
    () => sales.filter((s) => inFY(s.settlementDate, fyStartYear)),
    [sales, fyStartYear]
  );
  const referralsInFY = useMemo(
    () => referrals.filter((r) => inFY(r.referralDate, fyStartYear)),
    [referrals, fyStartYear]
  );

  if (loading) {
    return (
      <div className="tracker-root">
        <style>{CSS}</style>
        <div className="loading">Opening the ledger…</div>
      </div>
    );
  }

  return (
    <div className="tracker-root">
      <style>{CSS}</style>

      <header className="app-header">
        <div className="brand">
          <Home size={20} />
          <div>
            <h1>Sales Ledger</h1>
            <p>Lachlan Barclay · Morrison Kleeman Estate Agents</p>
          </div>
        </div>
        <div className="fy-switch">
          <button className="icon-btn" onClick={() => changeFY(-1)} aria-label="Previous financial year"><ChevronLeft size={18} /></button>
          <span>{fyLabel(fyStartYear)}</span>
          <button className="icon-btn" onClick={() => changeFY(1)} aria-label="Next financial year"><ChevronRight size={18} /></button>
        </div>
      </header>

      <nav className="bottom-nav">
        <button className={tab === "dashboard" ? "bottom-nav-item active" : "bottom-nav-item"} onClick={() => setTab("dashboard")}>
          <LayoutDashboard size={20} />
          <span>Dashboard</span>
        </button>
        <button className={tab === "sales" ? "bottom-nav-item active" : "bottom-nav-item"} onClick={() => setTab("sales")}>
          <ListChecks size={20} />
          <span>Sales</span>
        </button>
        <button className={tab === "referrals" ? "bottom-nav-item active" : "bottom-nav-item"} onClick={() => setTab("referrals")}>
          <KeyRound size={20} />
          <span>Referrals</span>
        </button>
      </nav>

      {saveError && (
        <div className="save-warning">Couldn't save your last change — it's still on screen, but try again in a moment.</div>
      )}

      <main>
        {tab === "dashboard" && (
          <DashboardTab salesInFY={salesInFY} referralsInFY={referralsInFY} fyStartYear={fyStartYear} onImportClick={() => setImportOpen(true)} />
        )}
        {tab === "sales" && (
          <SalesTab sales={sales} fyStartYear={fyStartYear} onAdd={addSale} onUpdate={updateSale} onDelete={deleteSale} />
        )}
        {tab === "referrals" && (
          <ReferralsTab referrals={referrals} onAdd={addReferral} onUpdate={updateReferral} onDelete={deleteReferral} />
        )}
      </main>

      {importOpen && (
        <ImportDataModal onImport={handleImport} onClose={() => setImportOpen(false)} />
      )}
    </div>
  );
}
